name: Daily Market Report

on:
  schedule:
    - cron: '47 10 * * 1-5' # Runs Mon-Fri, dodges top-of-hour server lag
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - name: Grab my code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Google AI and Market Data tools
        run: pip install google-generativeai yfinance

      - name: Run script and validate JSON file
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python api_server.py

      - name: Save and upload the file back to GitHub
        run: |
          git config --global user.name "Market Bot"
          git config --global user.email "bot@example.com"
          git add daily_report.json
          git commit -m "Fresh daily market report" || exit 0
          git push
