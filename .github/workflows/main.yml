name: Daily Market Report

on:
  schedule:
    - cron: '0 10 * * *' 
  workflow_dispatch: 

permissions:
  contents: write # This gives the robot permission to save the file

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - name: Grab my code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Google AI and Market Data tools
        run: pip install google-generativeai yfinance

      - name: Run script and create JSON file
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        # The ">" symbol catches the printed text and creates a file out of it
        run: python api_server.py > daily_report.json

      - name: Save and upload the file back to GitHub
        run: |
          git config --global user.name "Market Bot"
          git config --global user.email "bot@example.com"
          git add daily_report.json
          git commit -m "Fresh daily market report" || exit 0
          git push
